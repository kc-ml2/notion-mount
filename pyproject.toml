[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notion-mount"
version = "0.1.0"
description = "A read-only filesystem that uses Notion as the source of truth"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "notion-mount contributors" }]
keywords = ["notion", "markdown", "filesystem", "fuse", "sync"]
dependencies = [
    "notion-client>=2.2,<3",
    "notion-to-md-py>=0.1.5,<0.2",
]

[project.optional-dependencies]
fuse = ["fusepy>=3.0.1,<4"]
dev = ["pytest>=8,<10"]

[project.scripts]
notion-mount = "notion_mount.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notion_mount"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
